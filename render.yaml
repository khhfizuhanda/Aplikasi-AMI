services:
  - type: web
    name: aplikasi-ami
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node postgres/migrate.js && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PGSSL
        value: "true"
      - key: PGSCHEMA
        value: ami
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://khhfizuhanda.github.io